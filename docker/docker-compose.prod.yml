# Production overrides — composed on top of docker-compose.yml.
#
# Differences vs dev:
#   * Services pull pre-built images from GHCR instead of building locally.
#   * restart: always (was unless-stopped).
#   * Memory + cpu limits per spec §3 / NFR-03 (4 vCPU / 8 GB CCX13 budget).
#   * Caddy exposes 80/443 directly; rest-api/services do NOT publish ports.
#
# Image tags come from .env (IMAGE_TAG=v0.x.x or sha-<short>). The deploy
# script (scripts/deploy.sh) bumps the tag, runs `docker compose pull`, then
# `docker compose up -d --remove-orphans`.
#
# Usage:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d
name: evm-oracle-demo

services:
  postgres:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.5"

  redis:
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  price-service:
    image: ghcr.io/asolovov/evm-oracle-demo-price-service:${IMAGE_TAG_PRICE:-latest}
    build: !reset null
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  indexer-service:
    image: ghcr.io/asolovov/evm-oracle-demo-indexer-service:${IMAGE_TAG_INDEXER:-latest}
    build: !reset null
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  oracle-service:
    image: ghcr.io/asolovov/evm-oracle-demo-oracle-service:${IMAGE_TAG_ORACLE:-latest}
    build: !reset null
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  rest-api:
    image: ghcr.io/asolovov/evm-oracle-demo-api:${IMAGE_TAG_API:-latest}
    build: !reset null
    # Production never publishes the API to the host — Caddy is the only
    # public surface. Reset the dev `ports:` mapping.
    ports: !reset null
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  caddy:
    # Production unconditionally includes Caddy regardless of the
    # `--profile` flag — TLS termination is non-negotiable in prod.
    profiles: !reset null
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
