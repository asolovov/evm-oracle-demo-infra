# Production overrides — composed on top of docker-compose.yml.
#
# Differences vs the local/dev base:
#   * Services pull pre-built images from Docker Hub (docker.io/asolovov/*)
#     instead of building locally. Each service repo's Release workflow
#     publishes `<version>` + `latest` tags on merge to main.
#   * restart: always (base uses unless-stopped).
#   * Memory + cpu limits per spec §3 / NFR-03 (4 vCPU / 8 GB CCX13 budget).
#   * Every host port the base publishes for local debugging is RESET to
#     internal-only — nothing binds the VPS host except Caddy.
#   * Caddy is the single public surface (ports 80/443) and is force-enabled
#     regardless of the `tls` profile.
#
# Router choice: Caddy, not nginx. On a single VPS Caddy issues + auto-renews
# the Let's Encrypt cert with zero extra moving parts (no certbot, no renewal
# cron, no manual reload). nginx would need all of that for no benefit here.
#
# Image tags come from the env file (IMAGE_TAG_* = vX.Y.Z, or `latest`).
# scripts/deploy.sh pulls + recreates; recreate is stop-then-start, so the
# single oracle-service process never overlaps a redeploy (see base file).
#
# Usage (on the VPS, after `cp docker/env.example docker/.env` and editing):
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d
name: evm-oracle-demo

services:
  postgres:
    ports: !reset null
    restart: always
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.5"

  redis:
    ports: !reset null
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  price-service:
    image: docker.io/asolovov/evm-oracle-demo-price-service:${IMAGE_TAG_PRICE:-latest}
    build: !reset null
    ports: !reset null
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  indexer-service:
    image: docker.io/asolovov/evm-oracle-demo-indexer-service:${IMAGE_TAG_INDEXER:-latest}
    build: !reset null
    ports: !reset null
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  oracle-service:
    image: docker.io/asolovov/evm-oracle-demo-oracle-service:${IMAGE_TAG_ORACLE:-latest}
    build: !reset null
    ports: !reset null
    restart: always
    # stop_grace_period + single-replica/no-overlap constraints are inherited
    # from the base file — do NOT scale this service.
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  rest-api:
    image: docker.io/asolovov/evm-oracle-demo-api:${IMAGE_TAG_API:-latest}
    build: !reset null
    # Production never publishes the API to the host — Caddy is the only
    # public surface. Reset the dev `ports:` mapping (HTTP + healthz).
    ports: !reset null
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  caddy:
    # Production unconditionally includes Caddy regardless of the
    # `--profile` flag — TLS termination is non-negotiable in prod.
    profiles: !reset null
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
